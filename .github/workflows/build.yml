name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: litemux
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: litemux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: litemux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: litemux.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo test --locked
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: litemux-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir release
          for dir in litemux-*; do
            for file in "$dir"/*; do
              cp "$file" "release/$dir${file##*/litemux}"
            done
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}

[package]
name = "litemux"
version = "0.1.0"
edition = "2021"
authors = ["frozturk"]
description = "Small terminal session server that keeps programs running between app restarts"
license = "MIT"
publish = false

[dependencies]
portable-pty = "0.9"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
